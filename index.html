<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Burla Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-elevated: #21262d;
      --border: #30363d;
      --primary: #58a6ff;
      --secondary: #f78166;
      --success: #3fb950;
      --error: #f85149;
      --user-msg: #238636;
      --assistant-msg: #1f6feb;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --surface-elevated: #ffffff;
      --border: #d0d7de;
      --primary: #0969da;
      --secondary: #bc4c00;
      --success: #1a7f37;
      --error: #cf222e;
      --user-msg: #2da44e;
      --assistant-msg: #0969da;
      --text-primary: #24292f;
      --text-secondary: #57606a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, width 0.3s;
      flex-shrink: 0;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
      width: 0;
      border: none;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-section {
      margin-bottom: 24px;
    }

    .sidebar-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-group input[type="range"] {
      padding: 0;
      height: 4px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-full {
      width: 100%;
      justify-content: center;
    }

    .chat-history-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-history-item:hover {
      background: var(--surface-elevated);
    }

    .chat-history-item.active {
      background: var(--surface-elevated);
      border: 1px solid var(--primary);
    }

    .chat-history-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .chat-history-item .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }

    .chat-history-item:hover .delete-btn {
      opacity: 1;
    }

    .chat-history-item .delete-btn:hover {
      color: var(--error);
    }

    /* Main Chat Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }

    .toggle-btn:hover {
      background: var(--surface-elevated);
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--user-msg);
    }

    .message.assistant .message-avatar {
      background: var(--assistant-msg);
    }

    .message-content {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--user-msg);
      color: white;
      max-width: 70%;
    }

    .message.assistant .message-content {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
    }

    .message-content p {
      margin-bottom: 12px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content pre {
      background: var(--bg);
      border-radius: 6px;
      margin: 12px -16px;
      padding: 16px;
      overflow-x: auto;
      position: relative;
    }

    .message-content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .message-content p code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .message.user .message-content code {
      background: rgba(0, 0, 0, 0.3);
    }

    .code-block-wrapper {
      position: relative;
    }

    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .code-block-wrapper:hover .copy-code-btn {
      opacity: 1;
    }

    .copy-code-btn:hover {
      background: var(--border);
    }

    /* Input Footer */
    .input-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .textarea-container {
      flex: 1;
      position: relative;
    }

    .message-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 200px;
      min-height: 48px;
    }

    .message-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn:not(:disabled):hover {
      opacity: 0.9;
    }

    .stop-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--error);
      border: none;
      color: white;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stop-btn.visible {
      display: flex;
    }

    .input-footer-info {
      max-width: 800px;
      margin: 8px auto 0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 24px;
      padding: 4px;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    /* Status indicators */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .error-message {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 12px;
      color: var(--error);
      margin: 8px 0;
    }

    .offline-indicator {
      background: var(--secondary);
      color: white;
      padding: 8px 16px;
      text-align: center;
      font-size: 13px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
      }

      .message.user .message-content {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Settings</h2>
        <button class="toggle-btn" id="closeSidebar">✕</button>
      </div>
      <div class="sidebar-content">
        <!-- API Configuration -->
        <div class="sidebar-section">
          <h3>API Configuration</h3>
          <div class="form-group">
            <label for="providerPreset">Quick Setup (Free Options)</label>
            <select id="providerPreset">
              <option value="">-- Select a free provider --</option>
              <option value="ollama">Ollama (Local - Free)</option>
              <option value="groq">Groq Cloud (Free Tier)</option>
              <option value="openai">OpenAI (Paid)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-... or leave empty for Ollama">
          </div>
          <div class="form-group">
            <label for="llamaEndpoint">Endpoint URL</label>
            <input type="url" id="llamaEndpoint" placeholder="http://localhost:11434 or https://api.groq.com/openai/v1">
          </div>
          <div id="setupHelp" style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;"></div>
        </div>

        <!-- Model Settings -->
        <div class="sidebar-section">
          <h3>Model Settings</h3>
          <div class="form-group">
            <label for="provider">Provider</label>
            <select id="provider">
              <option value="openai">OpenAI</option>
              <option value="llama">LLaMA Cloud</option>
            </select>
          </div>
          <div class="form-group">
            <label for="model">Model</label>
            <select id="model">
              <option value="gpt-4">GPT-4</option>
              <option value="gpt-4-turbo">GPT-4 Turbo</option>
              <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="temperature">Temperature: <span id="temperatureValue">0.7</span></label>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
          </div>
          <div class="form-group">
            <label for="maxTokens">Max Tokens</label>
            <input type="number" id="maxTokens" value="2048" min="1" max="8192">
          </div>
        </div>

        <!-- Chat History -->
        <div class="sidebar-section">
          <h3>Chat History</h3>
          <button class="btn btn-primary btn-full" id="newChatBtn" style="margin-bottom: 12px;">
            + New Chat
          </button>
          <div id="chatHistoryList"></div>
        </div>

        <!-- Settings Actions -->
        <div class="sidebar-section">
          <h3>Actions</h3>
          <button class="btn btn-secondary btn-full" id="settingsBtn" style="margin-bottom: 8px;">
            ⚙️ Settings
          </button>
          <button class="btn btn-secondary btn-full" id="exportBtn">
            📥 Export Chat
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main">
      <!-- Header -->
      <header class="header">
        <button class="toggle-btn" id="toggleSidebar">☰</button>
        <h1>IA Burla Chat</h1>
        <span id="modelIndicator" style="font-size: 13px; color: var(--text-secondary);"></span>
      </header>

      <!-- Offline Indicator -->
      <div id="offlineIndicator" class="offline-indicator" style="display: none;">
        You are offline. Messages will be queued.
      </div>

      <!-- Chat Container -->
      <div class="chat-container" id="chatContainer">
        <!-- Messages will be rendered here -->
      </div>

      <!-- Input Footer -->
      <footer class="input-footer">
        <div class="input-wrapper">
          <div class="textarea-container">
            <textarea
              class="message-input"
              id="messageInput"
              placeholder="Type a message..."
              rows="1"
            ></textarea>
          </div>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
            </svg>
          </button>
          <button class="stop-btn" id="stopBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </button>
        </div>
        <div class="input-footer-info">
          <span id="charCount">0 characters</span>
          <span>Enter to send, Shift+Enter for newline</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="closeSettingsModal">&times;</button>
      </div>
      <div class="modal-content">
        <div class="form-group">
          <label>
            <input type="checkbox" id="themeToggle"> Light Theme
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="markdownPreview"> Markdown Preview (in input)
          </label>
        </div>
        <button class="btn btn-danger btn-full" id="clearChatsBtn">
          🗑️ Clear All Chats
        </button>
        <button class="btn btn-secondary btn-full" id="clearApiKeyBtn">
          🔑 Clear API Key
        </button>
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
          <h3 style="font-size: 14px; margin-bottom: 8px;">About</h3>
          <p style="font-size: 13px; color: var(--text-secondary);">
            IA Burla Chat v1.0<br>
            A unified interface for AI chat with multiple provider support.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // State Management
    // ============================================
    const STORAGE_KEY = 'ia_burla_chat_data';

    const defaultState = {
      conversations: [],
      settings: {
        provider: 'ollama',
        model: 'llama3.2',
        temperature: 0.7,
        maxTokens: 2048,
        apiKey: '',
        llamaEndpoint: 'http://localhost:11434',
        theme: 'dark',
        sidebarOpen: true,
        markdownPreview: false
      },
      activeConversationId: null
    };

    let state = loadState();
    let abortController = null;
    let isStreaming = false;

    // ============================================
    // LocalStorage Functions
    // ============================================
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return { ...defaultState, ...parsed, settings: { ...defaultState.settings, ...parsed.settings } };
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      return { ...defaultState };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // ============================================
    // DOM Elements
    // ============================================
    const elements = {
      sidebar: document.getElementById('sidebar'),
      chatContainer: document.getElementById('chatContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      stopBtn: document.getElementById('stopBtn'),
      charCount: document.getElementById('charCount'),
      chatHistoryList: document.getElementById('chatHistoryList'),
      modelIndicator: document.getElementById('modelIndicator'),
      offlineIndicator: document.getElementById('offlineIndicator'),
      // Sidebar inputs
      apiKey: document.getElementById('apiKey'),
      llamaEndpoint: document.getElementById('llamaEndpoint'),
      provider: document.getElementById('provider'),
      providerPreset: document.getElementById('providerPreset'),
      model: document.getElementById('model'),
      temperature: document.getElementById('temperature'),
      temperatureValue: document.getElementById('temperatureValue'),
      maxTokens: document.getElementById('maxTokens'),
      setupHelp: document.getElementById('setupHelp'),
      // Buttons
      toggleSidebar: document.getElementById('toggleSidebar'),
      closeSidebar: document.getElementById('closeSidebar'),
      newChatBtn: document.getElementById('newChatBtn'),
      settingsBtn: document.getElementById('settingsBtn'),
      exportBtn: document.getElementById('exportBtn'),
      // Modal
      settingsModal: document.getElementById('settingsModal'),
      closeSettingsModal: document.getElementById('closeSettingsModal'),
      themeToggle: document.getElementById('themeToggle'),
      markdownPreview: document.getElementById('markdownPreview'),
      clearChatsBtn: document.getElementById('clearChatsBtn'),
      clearApiKeyBtn: document.getElementById('clearApiKeyBtn')
    };

    // ============================================
    // UI Rendering
    // ============================================
    function render() {
      renderTheme();
      renderSidebar();
      renderChatHistory();
      renderMessages();
      renderModelIndicator();
      updateOnlineStatus();
    }

    function renderTheme() {
      document.body.setAttribute('data-theme', state.settings.theme);
      elements.themeToggle.checked = state.settings.theme === 'light';
    }

    function renderSidebar() {
      elements.sidebar.classList.toggle('collapsed', !state.settings.sidebarOpen);
      elements.apiKey.value = state.settings.apiKey;
      elements.llamaEndpoint.value = state.settings.llamaEndpoint;
      elements.provider.value = state.settings.provider;
      elements.temperature.value = state.settings.temperature;
      elements.temperatureValue.textContent = state.settings.temperature;
      elements.maxTokens.value = state.settings.maxTokens;

      // Set provider preset dropdown
      if (state.settings.llamaEndpoint === 'http://localhost:11434') {
        elements.providerPreset.value = 'ollama';
        elements.setupHelp.innerHTML = '💡 <strong>Ollama:</strong> Install at <a href="https://ollama.com" target="_blank">ollama.com</a>. Run <code>ollama run llama3.2</code> first. No API key needed.';
      } else if (state.settings.llamaEndpoint === 'https://api.groq.com/openai/v1') {
        elements.providerPreset.value = 'groq';
        elements.setupHelp.innerHTML = '💡 <strong>Groq:</strong> Get free API key at <a href="https://console.groq.com" target="_blank">console.groq.com</a>. Fast inference, free tier.';
      } else if (state.settings.provider === 'openai') {
        elements.providerPreset.value = 'openai';
        elements.setupHelp.innerHTML = '💡 <strong>OpenAI:</strong> Get API key at <a href="https://platform.openai.com" target="_blank">platform.openai.com</a>. Paid service.';
      } else {
        elements.providerPreset.value = '';
        elements.setupHelp.innerHTML = '';
      }

      updateModelOptions();
    }

    function renderChatHistory() {
      elements.chatHistoryList.innerHTML = '';
      state.conversations.forEach(conv => {
        const item = document.createElement('div');
        item.className = `chat-history-item${conv.id === state.activeConversationId ? ' active' : ''}`;
        item.innerHTML = `
          <span class="name">${escapeHtml(conv.name)}</span>
          <button class="delete-btn" data-id="${conv.id}">🗑️</button>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-btn')) {
            deleteConversation(conv.id);
          } else {
            loadConversation(conv.id);
          }
        });
        elements.chatHistoryList.appendChild(item);
      });
    }

    function renderMessages() {
      elements.chatContainer.innerHTML = '';
      const conversation = getActiveConversation();
      if (!conversation) {
        elements.chatContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">
            <p style="font-size: 18px; margin-bottom: 8px;">Welcome to IA Burla Chat</p>
            <p style="font-size: 14px;">Start a new conversation or select one from history</p>
          </div>
        `;
        return;
      }

      conversation.messages.forEach(msg => {
        appendMessage(msg.role, msg.content, false);
      });

      scrollToBottom();
    }

    function renderModelIndicator() {
      const providerNames = { openai: 'OpenAI', ollama: 'Ollama', groq: 'Groq', llama: 'LLaMA' };
      const name = providerNames[state.settings.provider] || state.settings.provider;
      elements.modelIndicator.textContent = `${name} - ${state.settings.model}`;
    }

    function updateModelOptions() {
      const provider = elements.provider.value;
      elements.model.innerHTML = '';

      if (provider === 'openai') {
        const models = ['gpt-4', 'gpt-4-turbo', 'gpt-3.5-turbo'];
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          elements.model.appendChild(opt);
        });
      } else if (provider === 'ollama') {
        const models = ['llama3.2', 'llama3.1', 'mistral', 'gemma2', 'phi3', 'codellama'];
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          elements.model.appendChild(opt);
        });
      } else if (provider === 'groq') {
        const models = ['llama-3.1-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768', 'gemma2-9b-it'];
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          elements.model.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.value = 'llama';
        opt.textContent = 'Custom LLaMA Model';
        elements.model.appendChild(opt);
      }

      elements.model.value = state.settings.model;
    }

    // ============================================
    // Message Rendering
    // ============================================
    function appendMessage(role, content, scroll = true) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      if (role === 'assistant') {
        contentDiv.innerHTML = parseMarkdown(content);
        addCopyButtons(contentDiv);
      } else {
        contentDiv.textContent = content;
      }

      messageDiv.appendChild(role === 'assistant' ? avatar : contentDiv);
      if (role === 'assistant') {
        messageDiv.appendChild(contentDiv);
      }

      elements.chatContainer.appendChild(messageDiv);

      if (scroll) {
        scrollToBottom();
      }
    }

    function parseMarkdown(content) {
      try {
        return marked.parse(content);
      } catch (e) {
        return escapeHtml(content);
      }
    }

    function addCopyButtons(container) {
      const codeBlocks = container.querySelectorAll('pre');
      codeBlocks.forEach(pre => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => {
          const code = pre.querySelector('code')?.textContent || pre.textContent;
          await navigator.clipboard.writeText(code);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => copyBtn.textContent = 'Copy', 2000);
        });
        wrapper.appendChild(copyBtn);
      });
    }

    function showTypingIndicator() {
      const indicator = document.createElement('div');
      indicator.className = 'message assistant';
      indicator.id = 'typingIndicator';
      indicator.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-content">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      elements.chatContainer.appendChild(indicator);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    function showError(message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.textContent = message;
      elements.chatContainer.appendChild(errorDiv);
      scrollToBottom();
    }

    // ============================================
    // Conversation Management
    // ============================================
    function getActiveConversation() {
      return state.conversations.find(c => c.id === state.activeConversationId);
    }

    function createConversation() {
      const conv = {
        id: Date.now().toString(),
        name: 'New Chat',
        createdAt: Date.now(),
        messages: []
      };
      state.conversations.unshift(conv);
      state.activeConversationId = conv.id;
      saveState();
      render();
      renderMessages();
    }

    function loadConversation(id) {
      state.activeConversationId = id;
      saveState();
      render();
      renderMessages();
    }

    function deleteConversation(id) {
      state.conversations = state.conversations.filter(c => c.id !== id);
      if (state.activeConversationId === id) {
        state.activeConversationId = state.conversations[0]?.id || null;
      }
      saveState();
      render();
      renderMessages();
    }

    function updateConversationName(id, name) {
      const conv = state.conversations.find(c => c.id === id);
      if (conv) {
        conv.name = name;
        saveState();
        renderChatHistory();
      }
    }

    function addMessageToConversation(role, content) {
      const conv = getActiveConversation();
      if (!conv) return;

      conv.messages.push({
        role,
        content,
        timestamp: Date.now()
      });

      // Auto-generate name from first message
      if (conv.messages.length === 1) {
        conv.name = content.slice(0, 30) + (content.length > 30 ? '...' : '');
      }

      saveState();
      renderChatHistory();
    }

    // ============================================
    // API Calls
    // ============================================
    async function sendMessage() {
      const content = elements.messageInput.value.trim();
      if (!content || isStreaming) return;

      const { apiKey, llamaEndpoint, provider } = state.settings;

      if (provider === 'openai' && !apiKey) {
        showError('Please enter your OpenAI API key in settings');
        return;
      }

      if (provider === 'llama' && !llamaEndpoint) {
        showError('Please enter your LLaMA endpoint URL in settings');
        return;
      }

      if (!navigator.onLine) {
        showError('You are offline. Please check your connection.');
        return;
      }

      // Add user message
      addMessageToConversation('user', content);
      appendMessage('user', content);
      elements.messageInput.value = '';
      elements.sendBtn.disabled = true;
      elements.charCount.textContent = '0 characters';

      // Show typing indicator
      showTypingIndicator();

      // Prepare messages for API
      const conversation = getActiveConversation();
      const messages = conversation.messages.map(m => ({
        role: m.role,
        content: m.content
      }));

      isStreaming = true;
      elements.stopBtn.classList.add('visible');
      elements.sendBtn.style.display = 'none';

      abortController = new AbortController();

      try {
        let response;
        let endpoint, headers, body;

        if (provider === 'openai') {
          endpoint = 'https://api.openai.com/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          };
          body = JSON.stringify({
            model: state.settings.model,
            messages,
            stream: true,
            temperature: state.settings.temperature,
            max_tokens: state.settings.maxTokens
          });
        } else if (provider === 'groq') {
          endpoint = llamaEndpoint || 'https://api.groq.com/openai/v1';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          };
          body = JSON.stringify({
            model: state.settings.model,
            messages,
            stream: false,
            temperature: state.settings.temperature,
            max_tokens: state.settings.maxTokens
          });
        } else if (provider === 'ollama') {
          endpoint = (llamaEndpoint || 'http://localhost:11434') + '/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json'
          };
          body = JSON.stringify({
            model: state.settings.model,
            messages,
            stream: false,
            temperature: state.settings.temperature,
            max_tokens: state.settings.maxTokens
          });
        } else {
          endpoint = `${llamaEndpoint}/chat/completions`;
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey || 'not-needed'}`
          };
          body = JSON.stringify({
            model: state.settings.model,
            messages,
            stream: false,
            temperature: state.settings.temperature,
            max_tokens: state.settings.maxTokens
          });
        }

        response = await fetch(endpoint, {
          method: 'POST',
          headers,
          body,
          signal: abortController.signal
        });

        if (!response.ok) {
          const error = await response.text();
          throw new Error(`API Error: ${response.status} - ${error}`);
        }

        removeTypingIndicator();

        if (provider === 'openai') {
          await handleStream(response);
        } else if (provider === 'groq') {
          const data = await response.json();
          const assistantMessage = data.choices[0].message.content;
          appendMessage('assistant', assistantMessage);
          addMessageToConversation('assistant', assistantMessage);
        } else if (provider === 'ollama') {
          const data = await response.json();
          const assistantMessage = data.choices[0].message.content;
          appendMessage('assistant', assistantMessage);
          addMessageToConversation('assistant', assistantMessage);
        } else {
          const data = await response.json();
          const assistantMessage = data.choices[0].message.content;
          appendMessage('assistant', assistantMessage);
          addMessageToConversation('assistant', assistantMessage);
        }
      } catch (error) {
        removeTypingIndicator();
        if (error.name === 'AbortError') {
          showError('Generation stopped');
        } else {
          showError(error.message);
        }
      } finally {
        isStreaming = false;
        elements.stopBtn.classList.remove('visible');
        elements.sendBtn.style.display = 'flex';
        abortController = null;
      }
    }

    async function handleStream(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let assistantContent = '';

      // Create message element for assistant
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = 'streamingMessage';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = 'AI';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(contentDiv);
      elements.chatContainer.appendChild(messageDiv);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices[0]?.delta?.content || '';
              assistantContent += delta;
              contentDiv.innerHTML = parseMarkdown(assistantContent);
              addCopyButtons(contentDiv);
              scrollToBottom();
            } catch (e) {
              // Ignore parse errors
            }
          }
        }
      }

      // Save final message
      addMessageToConversation('assistant', assistantContent);

      // Remove temporary element and re-render properly
      document.getElementById('streamingMessage')?.remove();
      renderMessages();
    }

    function stopGeneration() {
      if (abortController) {
        abortController.abort();
      }
    }

    // ============================================
    // Export Function
    // ============================================
    function exportChat() {
      const conversation = getActiveConversation();
      if (!conversation) {
        showError('No conversation to export');
        return;
      }

      const data = JSON.stringify(conversation, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chat-${conversation.id}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ============================================
    // Utilities
    // ============================================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
    }

    function updateOnlineStatus() {
      elements.offlineIndicator.style.display = navigator.onLine ? 'none' : 'block';
    }

    // ============================================
    // Event Listeners
    // ============================================

    // Sidebar toggle
    elements.toggleSidebar.addEventListener('click', () => {
      state.settings.sidebarOpen = !state.settings.sidebarOpen;
      saveState();
      renderSidebar();
    });

    elements.closeSidebar.addEventListener('click', () => {
      state.settings.sidebarOpen = false;
      saveState();
      renderSidebar();
    });

    // Message input
    elements.messageInput.addEventListener('input', () => {
      const length = elements.messageInput.value.length;
      elements.charCount.textContent = `${length} character${length !== 1 ? 's' : ''}`;
      elements.sendBtn.disabled = !elements.messageInput.value.trim();

      // Auto-resize
      elements.messageInput.style.height = 'auto';
      elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 200) + 'px';
    });

    elements.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    elements.sendBtn.addEventListener('click', sendMessage);
    elements.stopBtn.addEventListener('click', stopGeneration);

    // Provider preset quick setup
    elements.providerPreset.addEventListener('change', (e) => {
      const preset = e.target.value;
      if (!preset) return;

      if (preset === 'ollama') {
        elements.provider.value = 'ollama';
        elements.llamaEndpoint.value = 'http://localhost:11434';
        elements.apiKey.value = '';
        elements.setupHelp.innerHTML = '💡 <strong>Ollama:</strong> Install at <a href="https://ollama.com" target="_blank">ollama.com</a>. Run <code>ollama run llama3.2</code> first. No API key needed.';
      } else if (preset === 'groq') {
        elements.provider.value = 'groq';
        elements.llamaEndpoint.value = 'https://api.groq.com/openai/v1';
        elements.setupHelp.innerHTML = '💡 <strong>Groq:</strong> Get free API key at <a href="https://console.groq.com" target="_blank">console.groq.com</a>. Fast inference, free tier.';
      } else if (preset === 'openai') {
        elements.provider.value = 'openai';
        elements.llamaEndpoint.value = '';
        elements.setupHelp.innerHTML = '💡 <strong>OpenAI:</strong> Get API key at <a href="https://platform.openai.com" target="_blank">platform.openai.com</a>. Paid service.';
      }

      state.settings.provider = preset === 'openai' ? 'openai' : preset;
      state.settings.llamaEndpoint = elements.llamaEndpoint.value;
      state.settings.apiKey = elements.apiKey.value;
      saveState();
      updateModelOptions();
      renderModelIndicator();
    });

    // Settings inputs
    elements.apiKey.addEventListener('input', (e) => {
      state.settings.apiKey = e.target.value;
      saveState();
    });

    elements.llamaEndpoint.addEventListener('input', (e) => {
      state.settings.llamaEndpoint = e.target.value;
      saveState();
    });

    elements.provider.addEventListener('change', (e) => {
      state.settings.provider = e.target.value;
      state.settings.model = e.target.value === 'openai' ? 'gpt-4' : 'llama3.2';
      saveState();
      updateModelOptions();
      renderModelIndicator();
    });

    elements.model.addEventListener('change', (e) => {
      state.settings.model = e.target.value;
      saveState();
      renderModelIndicator();
    });

    elements.temperature.addEventListener('input', (e) => {
      state.settings.temperature = parseFloat(e.target.value);
      elements.temperatureValue.textContent = state.settings.temperature;
      saveState();
    });

    elements.maxTokens.addEventListener('input', (e) => {
      state.settings.maxTokens = parseInt(e.target.value) || 2048;
      saveState();
    });

    // Chat actions
    elements.newChatBtn.addEventListener('click', createConversation);
    elements.exportBtn.addEventListener('click', exportChat);

    // Modal
    elements.settingsBtn.addEventListener('click', () => {
      elements.settingsModal.classList.add('visible');
    });

    elements.closeSettingsModal.addEventListener('click', () => {
      elements.settingsModal.classList.remove('visible');
    });

    elements.settingsModal.addEventListener('click', (e) => {
      if (e.target === elements.settingsModal) {
        elements.settingsModal.classList.remove('visible');
      }
    });

    // Modal settings
    elements.themeToggle.addEventListener('change', (e) => {
      state.settings.theme = e.target.checked ? 'light' : 'dark';
      saveState();
      renderTheme();
    });

    elements.markdownPreview.addEventListener('change', (e) => {
      state.settings.markdownPreview = e.target.checked;
      saveState();
    });

    elements.clearChatsBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all chats?')) {
        state.conversations = [];
        state.activeConversationId = null;
        saveState();
        render();
        renderMessages();
        elements.settingsModal.classList.remove('visible');
      }
    });

    elements.clearApiKeyBtn.addEventListener('click', () => {
      state.settings.apiKey = '';
      elements.apiKey.value = '';
      saveState();
      elements.settingsModal.classList.remove('visible');
    });

    // Online/offline
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // ============================================
    // Initialize
    // ============================================
    // Initialize marked options
    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Create initial conversation if none exists
    if (state.conversations.length === 0) {
      createConversation();
    }

    render();
  </script>
</body>
</html>
